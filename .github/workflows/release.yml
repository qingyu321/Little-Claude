name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect edition
        id: edition
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "edition=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "release_name=Little Claude Alpha $TAG" >> $GITHUB_OUTPUT
            echo "extra_args=--config editions/alpha/tauri.alpha.conf.json" >> $GITHUB_OUTPUT
          else
            echo "edition=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=Little Claude $TAG" >> $GITHUB_OUTPUT
            echo "extra_args=" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION: ${{ steps.edition.outputs.edition }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.edition.outputs.release_name }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: ${{ steps.edition.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }} ${{ steps.edition.outputs.extra_args }}

      # Windows only: sign the NSIS installer with the updater private key
      # and push an updated latest.json to main (drives in-app auto-update).
      - name: Sign installer and update latest.json (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SETUP="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*setup.exe' | head -1)"
          echo "Signing installer: $SETUP"
          npx tauri signer sign "$SETUP" >/dev/null
          SIG="$(base64 -w0 "$SETUP.sig")"
          VERSION="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FILENAME="$(basename "$SETUP")"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILENAME}"
          export SIG VERSION PUB_DATE URL
          node - <<'NODE'
          const fs = require('fs');
          const { SIG, VERSION, PUB_DATE, URL } = process.env;
          const json = {
            version: VERSION,
            notes: '',
            pub_date: PUB_DATE,
            platforms: {
              'windows-x86_64-nsis': { url: URL, signature: SIG },
              'windows-x86_64': { url: URL, signature: SIG },
            },
          };
          fs.writeFileSync('latest.json', JSON.stringify(json, null, 4) + '\n');
          NODE
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore(updater): update latest.json for ${TAG}" || echo "No latest.json changes"
          git push origin main
