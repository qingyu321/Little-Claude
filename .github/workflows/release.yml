name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect edition
        id: edition
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "edition=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "release_name=Little Claude Alpha $TAG" >> $GITHUB_OUTPUT
            echo "extra_args=--config editions/alpha/tauri.alpha.conf.json" >> $GITHUB_OUTPUT
          else
            echo "edition=stable" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "release_name=Little Claude $TAG" >> $GITHUB_OUTPUT
            echo "extra_args=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      # 直接 shell 构建（含 bundle 安装包产物）。不用 tauri-action：
      # 它的 build-only 模式（无 tagName）会自动追加 --no-bundle，
      # 导致 release/bundle 目录不存在，后续签名/发布步骤找不到安装包。
      # 仅发布 Windows（用户决定：macOS/Linux 不再产出）。若将来恢复全平台，
      # 需重新加回 macOS 的 APPLE_* 签名 secrets——注意不能传未配置的 secrets
      # 做 env（GitHub 会置为空字符串，tauri-bundler 会对空证书执行
      # security import 而失败），且需 macOS adhoc 签名（signingIdentity: "-"）。
      - name: Build the app
        shell: bash
        env:
          EDITION: ${{ steps.edition.outputs.edition }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ steps.edition.outputs.extra_args }}

      # Sign the NSIS installer with the updater private key, publish it (with
      # latest.json) to the PUBLIC updater repo qingyu321/Little-Claude, which
      # drives in-app auto-update.
      - name: Publish Windows installer to updater repo
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.UPDATER_REPO_TOKEN }}
          UPDATER_REPO: qingyu321/Little-Claude
          RELEASE_TITLE: ${{ steps.edition.outputs.release_name }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SETUP="$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*setup.exe' | head -1)"
          echo "Signing installer: $SETUP"
          npx tauri signer sign "$SETUP" >/dev/null
          # idempotent create/upload via the shared publisher (clobbers stale assets)
          bash .github/scripts/publish.sh "$TAG" "$UPDATER_REPO" "$RELEASE_TITLE"
          SIG="$(base64 -w0 "$SETUP.sig")"
          VERSION="$(node -e "console.log(require('./src-tauri/tauri.conf.json').version)")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FILENAME="$(basename "$SETUP")"
          # GitHub sanitizes asset names on upload (spaces -> dots, illegal
          # chars -> underscores). The download URL must use the sanitized
          # name or it 404s — v1.1.1-alpha.1's latest.json shipped the raw
          # filename with spaces and auto-update downloads failed.
          URL_FILENAME="${FILENAME// /\.}"
          URL="https://github.com/${UPDATER_REPO}/releases/download/${TAG}/${URL_FILENAME}"
          export SIG VERSION PUB_DATE URL
          node - <<'NODE'
          const fs = require('fs');
          const { SIG, VERSION, PUB_DATE, URL } = process.env;
          const json = {
            version: VERSION,
            notes: '',
            pub_date: PUB_DATE,
            platforms: {
              'windows-x86_64-nsis': { url: URL, signature: SIG },
              'windows-x86_64': { url: URL, signature: SIG },
            },
          };
          fs.writeFileSync('latest.json', JSON.stringify(json, null, 4) + '\n');
          NODE
          # push latest.json to the public updater repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${UPDATER_REPO}.git" updater-repo
          cp latest.json updater-repo/
          cd updater-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "chore(updater): update latest.json for ${TAG}" || echo "No latest.json changes"
          git push origin main
